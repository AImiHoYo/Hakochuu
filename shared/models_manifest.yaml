# Hakochuu 服务端模型目录与本地缓存规划
# 可通过环境变量 HAKOCHUU_MODELS_ROOT 与 HAKOCHUU_CACHE_DIR 覆盖根路径

paths:
  models_root: "/path/to/pretrain_models"
  cache_dir: "./cache"

cache:
  hf_home: "./cache/hf"
  torch_home: "./cache/torch"
  audio_separator_models: "./cache/audio_separator"
  tmp_dir: "./cache/tmp"

models:
  llm:
    registry_dir: "./shared/llm_models"
    default_model_id: "qwen2.5-social-3b-nb-chat"
    provider: "vllm" # ollama | vllm
    model_name: "qwen2.5-social-3b-nb-chat"
    weights_dir: "/path/to/pretrain_models/Qwen2.5-Social-3B-NB-Chat"
    endpoint: "http://localhost:11434/v1"

  tts:
    engine: "cosyvoice3" # cosyvoice3 | qwen3_tts
    weights_dir: "/path/to/pretrain_models/Fun-CosyVoice3-0.5B"
    lora_dir: "./storage/characters"
    endpoint: "http://localhost:23334"

  vc:
    engine: "seed_vc"
    weights_dir: "/path/to/pretrain_models/seed-vc"
    endpoint: "http://localhost:23335"

  asr:
    engine: "sensevoice" # sensevoice | faster_whisper
    weights_dir: "/path/to/pretrain_models/SenseVoiceSmall"
    endpoint: "http://localhost:23336"

  separator:
    engine: "bs_roformer"
    weights_dir: "/path/to/pretrain_models/separator"
    model_filename: "model_bs_roformer_ep_317_sdr_12.9755.ckpt"
